# 複製成 config.yaml 後修改：cp config.example.yaml config.yaml
# 預設：掃描 Binance 成交量前 50 大 USDT 永續合約、4 小時突破波段、5 倍逐倉、多空雙向
#       同時最多 4 個持倉、每個持倉風險 0.75%
# 依據：2024-01～2026-10 真實資料，55 種幣組合回測 +95%(每年皆正)，最大回撤 -16.5%

market: future           # future = USDT 永續合約(可做空、槓桿) | spot = 現貨(只做多)
exchange:
  id: binance
  demo: false            # true = Binance 模擬交易(Demo Trading)帳戶，需另外申請 demo API key
symbol: ETH/USDT:USDT    # 單一幣模式(--symbol 或 scanner.enabled: false)用；現貨請改成 ETH/USDT
timeframe: 4h            # 訊號 K 線週期(breakout 用 4h；當沖策略才用 5m/15m)
history_bars: 500        # 計算指標所需的 K 線數量
poll_seconds: 5          # 每幾秒檢查一次即時價格(停損/停利/限價單成交)
state_dir: state         # 持倉狀態(重啟後可接續)
log_dir: logs            # 交易紀錄 CSV

futures:
  leverage: 5            # 槓桿倍數(交易所設定)
  margin_mode: isolated  # isolated 逐倉 | cross 全倉
  exchange_stop: true    # 在交易所端同步掛停損單：伺服器斷線也會停損(強烈建議開啟)
  funding_rate: 0.0001   # 回測/模擬用的資金費率估計(每 8 小時)，保守地多空都扣

orders:
  entry_type: market     # market = 市價進場(突破常常一去不回，限價單容易錯過) | limit = post-only 限價單
  limit_offset_bps: 0    # 限價比訊號價再好幾個 0.01%(越大越省但越難成交)
  limit_ttl_bars: 1      # 限價單幾根 K 線沒成交就取消
# 出場(停損/停利/平倉)一律用市價，確保一定出得去

paper:                   # 回測與模擬交易
  starting_cash: 300     # 起始資金(USDT)
  maker_fee: 0.0002      # Binance 合約 maker 0.02%
  taker_fee: 0.0005      # Binance 合約 taker 0.05%
  slippage: 0.0003       # 市價單滑價 0.03%

daytrade:                # 當沖：不留倉過夜(breakout 波段策略請保持關閉)
  enabled: false
  timezone: Asia/Taipei
  session_end: "07:45"   # 每天這個時間全部平倉，07:45 之後算新的一天
  no_entry_minutes_before_end: 60   # 收盤前 60 分鐘(06:45 後)不開新倉
  max_trades_per_day: 6  # 每天最多開幾次倉(限制手續費與過度交易)

notify:
  telegram: true         # 需在 .env 設定 TELEGRAM_BOT_TOKEN 和 TELEGRAM_CHAT_ID

scanner:                 # 全市場掃描(paper / live)；指令加 --symbol XXX 則只交易單一幣
  enabled: true
  top_n: 50              # 每天挑 24h 成交量前 50 大的 USDT 永續合約(自動排除穩定幣)
  min_quote_volume: 20000000   # 24h 成交量低於 2000 萬 USDT 的不碰(太冷門)
  refresh_hours: 24      # 幾小時重新挑一次名單
  max_positions: 4       # 同時最多幾個持倉(每種幣最多 1 個)
  risk_per_trade: 0.0075 # 每個持倉停損最多虧總資金 0.75%(4 倉同時虧 = 3%)
  settle_seconds: 20     # K 線收盤後等幾秒再抓資料
  exclude: []            # 永遠不交易的幣，例如 ["PEPE", "SHIB"]
# 同時有多個幣訊號時，優先進場「突破時成交量放大最多」的幣

strategy:
  name: breakout         # breakout = 4h 突破波段(預設) | pullback = 大週期順勢+回檔 | adaptive = 盤勢切換
  allow_long: true
  allow_short: true

  # --- breakout 策略 ---
  bo_n: 40               # 收盤突破前 40 根 K 線最高點 => 做多；跌破最低點 => 做空
  bo_min_volume_ratio: 0 # >0 時，突破 K 線成交量需達平均的 N 倍才進場(0 = 不限制，只用來排序)
  bo_volume_lookback: 180  # 成交量平均用前幾根 K 線(180 根 4h = 30 天)
  # 停損 = stop_atr_mult x ATR，之後以 trail_atr_mult x ATR 移動停損，不設停利，讓趨勢跑

  # --- pullback 策略 ---
  htf_timeframe: 4h      # 大週期：決定只做多或只做空
  htf_ema_fast: 20       # 大週期 EMA20 > EMA50 且收盤在 EMA50 上 => 只做多(反之只做空)
  htf_ema_slow: 50
  pullback_ema: 20       # 小週期回檔結束確認：收盤重新站上/跌破 EMA20
  pullback_rsi: 40       # 回檔深度：近期 RSI 跌破 40(做空則是突破 60)才算回檔
  pullback_lookback: 8   # 往回看幾根 K 線找回檔
  min_stop_atr: 1.0      # 停損放在回檔低點外，距離限制在 1~3 倍 ATR
  max_stop_atr: 3.0      # 停損太遠(回檔太深)就不做
  take_profit_r: 2.0     # 停利 = 2 倍風險(虧 1 賺 2)；0 = 不設停利，改用 ATR 移動停損
  breakeven_r: 1.0       # 賺到 1 倍風險時，停損移到成本價(保本)；0 = 關閉

  # --- adaptive 策略 / 共用 ---
  ema_fast: 12
  ema_slow: 26
  ema_trend: 200         # 長期趨勢過濾
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  adx_period: 14
  adx_trend: 25          # ADX >= 此值 => 趨勢盤(順勢做多/做空)
  adx_range: 20          # ADX <= 此值 => 盤整盤(布林通道高空低多)
  stop_atr_mult: 3.0     # 初始停損距離 = 3 x ATR
  trail_atr_mult: 4.0    # 移動停損 = 最有利價格 -/+ 4 x ATR(沒有停利目標的單才用)
  adx_rising: true       # 趨勢進場需 ADX 正在上升
  adx_rising_bars: 3
  trend_exit_on_di: false        # true = 反向 DI 轉強就出場(較敏感)
  range_trend_filter: true       # 盤整單只順著 EMA200 方向做(不逆勢接刀)

risk:
  risk_per_trade: 0.015  # 單一幣模式：每筆停損最多虧總資金 1.5%(掃描模式改用 scanner.risk_per_trade)
  max_exposure: 5.0      # 部位名目價值最多 = 5 倍總資金
  max_drawdown: 0.20     # 從高點回撤 20% => 停止開新倉(刪除 state 檔才恢復)
  daily_loss_limit: 0.06 # 當日虧損 6% => 當天停止開新倉
  min_notional: 20       # Binance ETH 合約最小下單金額約 20 USDT
  cooldown_bars: 0       # 平倉後等幾根 K 線才再進場
